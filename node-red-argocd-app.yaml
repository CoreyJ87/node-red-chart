apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-red
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/node-red-chart.git
    targetRevision: HEAD
    path: charts/node-red
  destination:
    server: https://kubernetes.default.svc
    namespace: node-red
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # You can add custom values here (same effect as helm values)
  helm:
    values: |
      persistence:
        enabled: true
        size: 10Gi
      # Uncomment and adjust the following if you want to expose Node-RED outside the cluster
      # service:
      #   type: LoadBalancer
      # Or using ingress
      # ingress:
      #   enabled: true
      #   hosts:
      #     - host: node-red.home.local
      #       paths:
      #         - path: /
      #           pathType: Prefix 