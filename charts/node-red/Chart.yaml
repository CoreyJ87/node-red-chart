apiVersion: v2
name: node-red
description: A Helm chart for Node-Red, a low-code programming for event-driven applications
home: https://nodered.org/
sources:
  - https://github.com/SchwarzIT/node-red-chart

icon: https://nodered.org/about/resources/media/node-red-icon-2.png

type: application

kubeVersion: ">=1.19.0-0"

version: 0.35.0
appVersion: 4.0.9

keywords:
  - node-red
  - iot
  - home
  - automation

# Original chart authors: dirien (Engin Diri) and Kaktor (Felix Kammerer) of SchwarzIT — see https://github.com/SchwarzIT/node-red-chart
maintainers:
  - name: CoreyJ87
    email: synik4l@gmail.com
    url: https://github.com/CoreyJ87

annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - "[SECURITY] rbac.createClusterRole now requires explicit clusterRoleRules; the implicit wildcard (cluster-admin) default has been removed"
    - Add automountServiceAccountToken value (default true, needed by the flow-refresh sidecar)
    - Add NetworkPolicy and PodDisruptionBudget templates
    - Add startupProbe, topologySpreadConstraints, priorityClassName values
    - Add service.nodePort and service.extraPorts values
    - Add settings.content to let the chart render the settings.js ConfigMap
    - Add sidecar.env.usernameFromExistingSecret
    - Harden the default sidecar securityContext to satisfy the restricted PodSecurity profile
    - Fix nil pointer in certificates.yaml when ingress.tls entries have no certificate block
    - Document replicaCount and fix imagePullSecrets default to a list
    - Default deployment strategy to Recreate when persistence is enabled
    - Fix port-forward instructions in NOTES.txt
    - Fix scoped npm module handling and sleep-time parsing in flow_refresh.py
    - Drop Ingress support for Kubernetes < 1.19 and declare kubeVersion >=1.19.0-0
  artifacthub.io/images: |
    - name: node-red
      image: docker.io/nodered/node-red:4.0.9
    - name: node-red-sidecar
      image: quay.io/kiwigrid/k8s-sidecar:1.30.5
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: original chart (SchwarzIT)
      url: https://github.com/SchwarzIT/node-red-chart
  artifacthub.io/maintainers: |
    - name: CoreyJ87
      email: synik4l@gmail.com
