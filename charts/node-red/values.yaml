# Default values for node-red.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# -- Number of replicas. Note: with persistence on a ReadWriteOnce volume only 1 replica can mount it
replicaCount: 1

# -- Specifies the strategy used to replace old Pods by new ones, default: `RollingUpdate` (`Recreate` when persistence is enabled, to avoid a deadlock on ReadWriteOnce volumes)
deploymentStrategy: ""
image:
  # -- The image registry to pull from
  registry: docker.io
  # -- The image repository to pull from
  repository: nodered/node-red
  # -- The image pull policy
  pullPolicy: IfNotPresent
  # -- The image tag to pull, default: `Chart.appVersion`
  tag: ""

rbac:
  # If enabled, roles will be created and bound to the service account. default: true
  enabled: true
  # -- Create a ClusterRole resource for the node-red pod. default: false
  createClusterRole: false


# -- The image pull secrets
imagePullSecrets: []
# - name: my-registry-secret

# -- Provide a name in place of node-red
nameOverride: ""
# -- String to fully override "node-red.fullname"
fullnameOverride: ""

npmrc:
  # -- Enable custom npmrc config
  enabled: false
  # -- Configuration to use any compatible registry
  registry: "https://registry.npmjs.org"
  # -- Configuration to add custom npmrc config
  content: |
    # Custom npmrc config

# -- node-red env, see more environment variables in the [node-red documentation](https://nodered.org/docs/getting-started/docker)
env: []
  # Possible Values:
  # TZ:
  # NODE_OPTIONS:
  # NODE_RED_ENABLE_PROJECTS:
  # NODE_RED_ENABLE_SAFE_MODE:
  # FLOWS:
  # example:
  # env:
  # - name: "NODE_RED_ENABLE_SAFE_MODE"
  #   value: ""
envFrom: []
  # Possible values:
  # - secretRef:
  #     name: node-red-env

serviceAccount:
  # Specifies whether a service account should be created
  # -- Create service account
  create: true
  # Annotations to add to the service account
  # -- Additional ServiceAccount annotations
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # -- Service account name to use, when empty will be set to created account if
  name: ""

# -- Whether to mount the ServiceAccount API token into the pod. The flow-refresh sidecar needs it to watch ConfigMaps; set to false if you run without the sidecar and your flows don't talk to the Kubernetes API
automountServiceAccountToken: true

# -- Pod annotations
podAnnotations: {}

# -- Deployment annotations
deploymentAnnotations: {}

# -- Pod Security Context see [values.yaml](values.yaml)
podSecurityContext:
  # -- node-red group is 1000
  fsGroup: 1000
  # -- node-red user is 1000
  runAsUser: 1000

# -- Security Context see [values.yaml](values.yaml)
securityContext:
  privileged: false
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsGroup: 10003
  runAsUser: 10003
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Kubernetes port where service is exposed
  port: 1880
  # -- Static node port to use when `service.type` is `NodePort` (leave empty for auto-assignment)
  nodePort: ""
  # -- Additional service ports, e.g. for TCP/UDP nodes running in your flows
  extraPorts: []
  # - name: mqtt
  #   port: 1883
  #   targetPort: 1883
  #   protocol: TCP
  # -- Annotations for the service
  annotations: {}

#  Enable Service-Monitor for node-red
metrics:
  # -- Deploy metrics service
  enabled: false
  path: /metrics
  serviceMonitor:
    # -- Enable a prometheus ServiceMonitor
    enabled: false
    # -- Prometheus basicAuth configuration for ServiceMonitor endpoint
    basicAuth: {}
    # -- Prometheus ServiceMonitor interval
    interval: 30s
    # -- Prometheus [RelabelConfigs] to apply to samples before scraping
    relabelings: []
    # -- Prometheus [MetricRelabelConfigs] to apply to samples before ingestion
    metricRelabelings: []
    # -- Prometheus ServiceMonitor selector
    selector: {}
    # prometheus: kube-prometheus

    # -- Prometheus ServiceMonitor namespace
    namespace: "" # "monitoring"
    # -- Prometheus ServiceMonitor labels
    additionalLabels: {}

persistence:
  # -- Use persistent volume to store data
  enabled: false
  ## node-red data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  # -- Type of persistent volume claim
  # storageClass: "-"
  ##
  ## If you want to reuse an existing claim, you can pass the name of the PVC using
  ## the existingClaim variable
  # -- Use an existing PVC to persist data
  # existingClaim: your-claim
  # -- Persistence access mode
  accessMode: ReadWriteOnce
  # -- Size of persistent volume claim
  size: 5Gi
  # -- ## Keep a created Persistent volume claim when uninstalling the helm chart (default: false)
  keepPVC: false

# -- containers which are run before the app containers are started
initContainers: []

ingress:
  # -- Enable an ingress resource for the server
  enabled: false
  # -- Defines which ingress controller will implement the resource
  className: ""
  # -- Additional ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    #  Ingress accepted hostnames
    - host: chart-example.local
      paths:
          # -- The base path
        - path: /
          # --  Ingress type of path
          pathType: ImplementationSpecific
  # --  Ingress TLS configuration
  tls: []
    # -- Secret name for the certificate
    # - secretName: chart-example-tls
    # -- Hostnames for the Ingress
    # hosts:
    #  - chart-example.local
    # -- Certificate used by the Cert-Manager
    # certificate:
    # -- Enable certificate
    #   enabled: true
    # -- Name of the certificate default: `$fullname-cert-$index`
    #   name: ""
    # -- Reference of ClusterIssuers or Issuer
    #   issuerRef:
    # -- Kind of the Issuer
    #     kind: ClusterIssuer
    # -- Name of the Issuer
    #     name: "test"

# -- Liveness probe for the Deployment. If you change `httpAdminRoot` in the settings, adjust the probe paths accordingly
livenessProbe:
  httpGet:
    path: /
    port: http

# -- Readiness probe for the Deployment. If you change `httpAdminRoot` in the settings, adjust the probe paths accordingly
readinessProbe:
  httpGet:
    path: /
    port: http

# -- Startup probe for the Deployment, protects slow-starting instances (e.g. many palette modules) from being killed by the liveness probe before they finish booting
startupProbe: {}
#  httpGet:
#    path: /
#    port: http
#  failureThreshold: 30
#  periodSeconds: 5

# -- CPU/Memory resource requests/limits. Set to `{}` if you prefer not to constrain the pod
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Node selector
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- The terminationGracePeriodSeconds for the pod
# here we explicitly set the default value defined in kubernetes
# https://github.com/kubernetes/api/blob/d4b94f478bb2e6467873657dd7b4e1b0ac8351be/core/v1/types.go#L3114-L3118
terminationGracePeriodSeconds: 30

# -- The affinity constraint
affinity: {}

# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: node-red

# -- Priority class name for the pod
priorityClassName: ""

# -- Extra Volumes for the pod
extraVolumes:
# - name: pv-claim
#   persistentVolumeClaim:
#     claimName: task-pv-volume
# - name: example
#   configMap:
#     name: example

# -- Extra Volume Mounts for the node-red pod
extraVolumeMounts:
# - name: test
#   mountPath: /test

# -- You can configure node-red using a settings file. default: {}
settings: {}
# Details about the content of the settings.js, you can lookup under
# https://nodered.org/docs/user-guide/runtime/settings-file
# Either let the chart create the ConfigMap for you by setting `content`:
#  content: |
#    module.exports = {
#      flowFile: 'flows.json',
#      ...
#    }
# Or reference an existing ConfigMap with a key named `settings.js`:
#  configMapName: settings-config

# -- Labels to add to the node-red pod. default: {}
podLabels: {}

# -- You can configure extra sidecars containers to run alongside the node-red pod. default: []
extraSidecars: []
#  - name: sidecar-example
#    image: busybox
#    command: ["/bin/sh", "-c", "echo hello from sidecar"]

networkPolicy:
  # -- Create a NetworkPolicy for the node-red pod
  enabled: false
  # -- Ingress rules for the NetworkPolicy. When empty, ingress is allowed from anywhere to the node-red ports
  ingress: []
  # - from:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: ingress-nginx
  # -- Egress rules for the NetworkPolicy. When empty, egress is not restricted by this policy
  egress: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget for the node-red pod
  enabled: false
  # -- Minimum number/percentage of pods that must remain available
  minAvailable: 1
  # -- Maximum number/percentage of pods that may be unavailable, mutually exclusive with `minAvailable`
  maxUnavailable: ""


## -- Enable this and set the rules: to whatever custom rules you want for the Cluster Role resource.
## Required when rbac.createClusterRole is true: the chart refuses to create a ClusterRole without explicit rules.
clusterRoleRules:
  # -- Enable custom rules for the application controller's ClusterRole resource default: false
  enabled: false
  # -- List of custom rules for the application controller's ClusterRole resource default: []
  rules: []

# Sidecar that collect the configmaps with specified label and stores the included files into the given folder
sidecar:
  # -- Enable the sidecar
  enabled: false
  # Env variables to pass to the sidecar
  env:
    # -- Set the sleep time for refresh script
    sleep_time_sidecar: 5s
    # -- If METHOD is set to LIST, the sidecar will just list config-maps/secrets and exit. With SLEEP it will list all config-maps/secrets, then sleep for SLEEP_TIME seconds. Anything else will continuously watch for changes (see https://kubernetes.io/docs/reference/using-api/api-concepts/#efficient-detection-of-changes).
    method: watch
    # -- Label that should be used for filtering
    label: node-red-settings
    # -- The value for the label you want to filter your resources on. Don't set a value to filter by any value
    label_value: "1"
    # -- Absolute path to shell script to execute after a configmap got reloaded.
    script: flow_refresh.py
    # The username for the API Call, check node-red documentation for more information
    username: ""
    # -- Username from existing secret
    usernameFromExistingSecret: {}
    # -- Name of the secret that contains the username
    #  name: node-red-api-admin-user
    # -- Key of the secret that contains the username
    #  key: username
    # -- Password as key value pair
    password: ""
    # -- Password from existing secret
    passwordFromExistingSecret: {}
    # -- Name of the secret that contains the password
    #  name: node-red-api-admin-password
    # -- Key of the secret that contains the password
    #  key: password
  # -- Extra Node-Modules that will be installed  from the sidecar script
  extraNodeModules: []
  # -- Extra Environments for the sidecar
  extraEnv: []
  # -- Resources for the sidecar
  resources: {}
  # -- Security context for the sidecar see [values.yaml](values.yaml)
  securityContext:
    privileged: false
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 10003
    runAsGroup: 10003
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  #  Image for the sidecar
  image:
    # -- The image registry to pull the sidecar from
    registry: quay.io
    # -- The image repository to pull from
    repository: kiwigrid/k8s-sidecar
    # -- The image tag to pull, default: `1.30.5`
    tag: 1.30.5
    # -- The image pull policy, default: `IfNotPresent`
    pullPolicy: IfNotPresent
  # -- The extra volume mounts for the sidecar
  volumeMounts: []
