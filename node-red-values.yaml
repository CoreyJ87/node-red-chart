persistence:
  enabled: true
  size: 10Gi

# Set resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Uncomment and adjust if you need to expose Node-RED
